<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Music</title>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-highlight: rgba(255, 255, 255, 0.28);
      --text-main: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.52);
      --accent-1: #ff2a85;
      --accent-2: #6a00ff;
      --accent-3: #00d2ff;
      --spring: cubic-bezier(0.22, 1, 0.36, 1);
      --pop-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06060b;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .gpu {
      will-change: transform;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* Ambient Beat-Reactive Background */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #050509;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      will-change: transform;
      transform: translate3d(0, 0, 0) scale3d(1, 1, 1);
      transition: background 0.8s ease;
    }

    .orb-1 {
      width: 420px;
      height: 420px;
      top: -130px;
      left: -110px;
      background: radial-gradient(circle, var(--accent-1) 0%, rgba(0,0,0,0) 70%);
      opacity: 0.55;
    }

    .orb-2 {
      width: 450px;
      height: 450px;
      bottom: -90px;
      right: -130px;
      background: radial-gradient(circle, var(--accent-2) 0%, rgba(0,0,0,0) 70%);
      opacity: 0.5;
    }

    .orb-3 {
      width: 340px;
      height: 340px;
      top: 35%;
      left: 12%;
      background: radial-gradient(circle, var(--accent-3) 0%, rgba(0,0,0,0) 70%);
      opacity: 0.32;
    }

    /* Frosted Glass Surface */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), inset 0 1px 0 var(--glass-highlight);
    }

    /* Main Shell */
    .app-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 16px 0 0 0;
      overflow: hidden;
    }

    /* Header */
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 20px 16px 20px;
    }

    .header-row h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.7px;
    }

    .sync-indicator {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      cursor: pointer;
      transition: transform 0.25s var(--spring), color 0.25s ease;
    }

    .sync-indicator:active {
      transform: scale3d(0.92, 0.92, 1);
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00e676;
      box-shadow: 0 0 8px #00e676;
    }

    /* Clock-Style Interactive Liquid Glass Segmented Slider */
    .segmented-wrap {
      padding: 0 20px;
      margin-bottom: 16px;
    }

    .segmented-control {
      position: relative;
      display: flex;
      height: 46px;
      padding: 4px;
      border-radius: 23px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(25px) saturate(190%);
      -webkit-backdrop-filter: blur(25px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.35);
      touch-action: none;
    }

    .segment-pill {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: calc((100% - 8px) / 3);
      border-radius: 19px;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(16px) brightness(1.15);
      -webkit-backdrop-filter: blur(16px) brightness(1.15);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.45);
      transform: translate3d(0, 0, 0) scale3d(1, 1, 1);
      transition: transform 0.42s var(--spring), background 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      z-index: 0;
      pointer-events: none;
    }

    /* Glassy Pop-Up State when touched/dragged (like Clock App) */
    .segment-pill.pop {
      background: rgba(255, 255, 255, 0.26);
      border-color: rgba(255, 255, 255, 0.58);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5), 0 0 18px rgba(255, 255, 255, 0.14), inset 0 1.5px 2px rgba(255, 255, 255, 0.75);
    }

    .segment-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-dim);
      background: transparent;
      border: none;
      position: relative;
      z-index: 1;
      cursor: pointer;
      transition: color 0.25s ease, transform 0.25s var(--spring);
      pointer-events: none;
    }

    .segment-btn.active {
      color: #ffffff;
    }

    /* 1:1 Hand-Proportional Horizontal View Pager */
    .views-viewport {
      flex: 1;
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    .views-track {
      display: flex;
      width: 300%;
      height: 100%;
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }

    .view-page {
      width: 33.333333%;
      height: 100%;
      overflow-y: auto;
      padding: 4px 20px 115px 20px;
      -webkit-overflow-scrolling: touch;
    }
    .view-page::-webkit-scrollbar {
      display: none;
    }

    /* Empty State / Auto-Sync Setup Card */
    .empty-card {
      margin-top: 36px;
      padding: 32px 22px;
      border-radius: 28px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .empty-icon {
      width: 60px;
      height: 60px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .empty-card h3 {
      font-size: 18px;
      font-weight: 700;
    }

    .empty-card p {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.5;
      max-width: 260px;
    }

    .glass-action-btn {
      margin-top: 6px;
      padding: 12px 22px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.22s var(--pop-spring), background 0.2s ease;
    }

    .glass-action-btn:active {
      transform: scale3d(0.93, 0.93, 1);
      background: rgba(255, 255, 255, 0.24);
    }

    /* Track List */
    .track-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .track-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 13px;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.25s var(--spring), background 0.25s ease, border-color 0.25s ease;
    }

    .track-item:active {
      transform: scale3d(0.97, 0.97, 1);
    }

    .track-item.active {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.34);
    }

    .track-left {
      display: flex;
      align-items: center;
      gap: 13px;
      overflow: hidden;
      flex: 1;
    }

    .track-art {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #fff;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
    }

    .track-meta {
      overflow: hidden;
      flex: 1;
    }

    .track-meta h4 {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .track-meta p {
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .more-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s var(--spring);
    }

    .more-btn:active {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      transform: scale3d(0.88, 0.88, 1);
    }

    /* Playlists View */
    .playlist-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .playlist-header-bar h3 {
      font-size: 17px;
      font-weight: 700;
    }

    .new-playlist-btn {
      padding: 8px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.11);
      cursor: pointer;
      transition: transform 0.2s var(--pop-spring);
    }

    .new-playlist-btn:active {
      transform: scale3d(0.92, 0.92, 1);
    }

    .playlist-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .playlist-card {
      padding: 16px;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 125px;
      cursor: pointer;
      transition: transform 0.25s var(--spring);
    }

    .playlist-card:active {
      transform: scale3d(0.95, 0.95, 1);
    }

    .playlist-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .playlist-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .playlist-card h4 {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playlist-card p {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* Floating Mini-Player (Proportional Drag-Up Ready) */
    .mini-player {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      margin: 0 auto;
      width: calc(100% - 32px);
      max-width: 428px;
      height: 66px;
      border-radius: 22px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 40;
      cursor: pointer;
      touch-action: none;
      transition: transform 0.45s var(--spring), opacity 0.35s ease;
    }

    .mini-player.hidden {
      transform: translate3d(0, 140%, 0);
      opacity: 0;
      pointer-events: none;
    }

    .mini-left {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
      flex: 1;
    }

    .mini-art {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      will-change: transform;
    }

    .mini-text {
      overflow: hidden;
    }

    .mini-text h4 {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-text p {
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.11);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s var(--pop-spring), background 0.2s ease;
    }

    .icon-btn:active {
      transform: scale3d(0.84, 0.84, 1);
      background: rgba(255, 255, 255, 0.24);
    }

    /* Fullscreen Interactive Sliding Now Playing Sheet */
    .now-playing-sheet {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(10, 10, 18, 0.82);
      backdrop-filter: blur(38px) saturate(190%);
      -webkit-backdrop-filter: blur(38px) saturate(190%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 26px 34px 26px;
      transform: translate3d(0, 105%, 0);
      transition: transform 0.5s var(--spring);
      max-width: 480px;
      margin: 0 auto;
      border-top: 1px solid rgba(255, 255, 255, 0.22);
      touch-action: none;
    }

    .sheet-pill-wrap {
      width: 100%;
      padding: 10px 0;
      display: flex;
      justify-content: center;
      cursor: pointer;
    }

    .sheet-pill {
      width: 42px;
      height: 5px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.35);
    }

    /* Beat-Matched Artwork Stage */
    .art-stage {
      position: relative;
      width: 100%;
      height: 255px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .art-glow-ring {
      position: absolute;
      width: 245px;
      height: 245px;
      border-radius: 42px;
      background: radial-gradient(circle, var(--accent-1) 0%, rgba(0,0,0,0) 72%);
      opacity: 0.25;
      will-change: transform, opacity;
      pointer-events: none;
    }

    .main-art {
      width: 228px;
      height: 228px;
      border-radius: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.28);
      will-change: transform;
    }

    /* Visualizer */
    .visualizer-box {
      width: 100%;
      height: 70px;
      border-radius: 20px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #beatCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .np-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .np-text {
      overflow: hidden;
      flex: 1;
    }

    .np-text h2 {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.4px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .np-text p {
      font-size: 14px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Interactive Progress Slider */
    .progress-area {
      width: 100%;
    }

    .seek-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.18);
      outline: none;
      cursor: pointer;
      transition: height 0.2s ease;
    }

    .seek-slider:active {
      height: 9px;
    }

    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 7px;
      font-weight: 600;
    }

    .np-controls {
      display: flex;
      align-items: center;
      justify-content: space-around;
    }

    .ctrl-lg {
      width: 52px;
      height: 52px;
    }

    .play-main {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #ffffff;
      color: #080810;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(255, 255, 255, 0.3);
      transition: transform 0.22s var(--pop-spring);
    }

    .play-main:active {
      transform: scale3d(0.88, 0.88, 1);
    }

    /* Action Menu & Modal Sheets (Delete, Queue, Playlist) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 150;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .action-sheet {
      width: 100%;
      max-width: 460px;
      border-radius: 28px 28px 0 0;
      padding: 20px 20px 30px 20px;
      background: rgba(20, 20, 32, 0.88);
      backdrop-filter: blur(35px) saturate(190%);
      -webkit-backdrop-filter: blur(35px) saturate(190%);
      border-top: 1px solid rgba(255, 255, 255, 0.22);
      transform: translate3d(0, 100%, 0);
      transition: transform 0.38s var(--spring);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-backdrop.open .action-sheet {
      transform: translate3d(0, 0, 0);
    }

    .sheet-track-header {
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 4px;
    }

    .sheet-track-header h4 {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sheet-track-header p {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .sheet-option {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-size: 14.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.2s var(--spring), background 0.2s ease;
    }

    .sheet-option:active {
      transform: scale3d(0.97, 0.97, 1);
      background: rgba(255, 255, 255, 0.15);
    }

    .sheet-option.danger {
      color: #ff4d6d;
      border-color: rgba(255, 77, 109, 0.22);
      background: rgba(255, 77, 109, 0.08);
    }

    .glass-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 15px;
      outline: none;
      margin: 6px 0;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translate3d(-50%, -80px, 0);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight:600;
      z-index: 200;
      transition: transform 0.4s var(--pop-spring);
      pointer-events: none;
    }

    .toast.show {
      transform: translate3d(-50%, 0, 0);
    }

    #hiddenFileInput, #hiddenFolderInput {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Ambient Background Orbs -->
  <div class="ambient-bg">
    <div class="orb orb-1" id="orb1"></div>
    <div class="orb orb-2" id="orb2"></div>
    <div class="orb orb-3" id="orb3"></div>
  </div>

  <!-- Clean Glass Toast -->
  <div class="toast glass" id="toastEl">Saved</div>

  <!-- Hidden Fallback Inputs for Storage Sync -->
  <input type="file" id="hiddenFolderInput" webkitdirectory directory multiple accept="audio/*" />
  <input type="file" id="hiddenFileInput" multiple accept="audio/*" />

  <!-- Main App Shell -->
  <div class="app-shell">
    <div class="header-row">
      <h1>Library</h1>
      <div class="sync-indicator glass" id="syncStorageBtn" title="Sync Downloads Folder">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncStatusText">Auto-Sync</span>
      </div>
    </div>

    <!-- Clock-Style Touch-Proportional Liquid Glass Segmented Bar -->
    <div class="segmented-wrap">
      <div class="segmented-control" id="segmentedBar">
        <div class="segment-pill gpu" id="segmentPill"></div>
        <button class="segment-btn active">Tracks</button>
        <button class="segment-btn">Playlists</button>

    <!-- 1:1 Hand-Swipeable Horizontal Views -->

  <!-- Fullscreen Interactive Sliding Now Playing Sheet -->
  <div class="now-playing-sheet gpu" id="nowPlayingSheet">

      </button>

      <button class="icon-btn ctrl-lg" id="nextBtn" aria-label="Next">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l10 8-10 8V4zm12 1h2v14h-2V5z"/></svg>

  <!-- Track Options Action Sheet (Add to Queue, Add to Playlist, Delete) -->
  <div class="modal-backdrop" id="trackMenuModal">
    <div class="action-sheet" id="trackMenuSheet"></div>
  </div>

  <script>
    /**************************************************************
     * 1. INDEXED-DB PERMANENT STORAGE & DOWNLOADS AUTO-SYNC ENGINE
     * Automatically saves downloaded songs & playlists permanently,
     * and watches the linked Download folder when returning from Chrome.
     **************************************************************/
    const DB_NAME = "GlassMusicStorageDB";
    const DB_VERSION = 1;
    let db = null;
    let directoryHandle = null;

    let tracks = [];      // { id, name, artist, blob, url, colors }
    let playlists = [];   // { id, name, trackIds: [] }
    let playQueue = [];   // [trackId, ...]
    let activePlaylistId = null;

    const palettes = [
      ["#ff2a85", "#6a00ff", "#00d2ff"],
      ["#00c6ff", "#0072ff", "#7000ff"],
      ["#f7971e", "#ffd200", "#ff2a85"],
      ["#11998e", "#38ef7d", "#00d2ff"],
      ["#ff512f", "#dd2476", "#ff0055"]
    ];

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = e => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains("tracks")) {
            database.createObjectStore("tracks", { keyPath: "id" });
          }
          if (!database.objectStoreNames.contains("playlists")) {
            database.createObjectStore("playlists", { keyPath: "id" });
          }
          if (!database.objectStoreNames.contains("settings")) {
            database.createObjectStore("settings", { keyPath: "key" });
          }
        };
        req.onsuccess = e => {
          db = e.target.result;
          resolve(db);
        };
        req.onerror = () => reject(req.error);
      });
    }

    function dbGetAll(storeName) {
      return new Promise(resolve => {
        if (!db) return resolve([]);
        const tx = db.transaction(storeName, "readonly");
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
    }

    function dbPut(storeName, item) {
      return new Promise(resolve => {
        if (!db) return resolve();
        const tx = db.transaction(storeName, "readwrite");
        tx.objectStore(storeName).put(item);
        tx.oncomplete = () => resolve();
      });
    }

    function dbDelete(storeName, key) {
      return new Promise(resolve => {
        if (!db) return resolve();
        const tx = db.transaction(storeName, "readwrite");
        tx.objectStore(storeName).delete(key);
        tx.oncomplete = () => resolve();
      });
    }

    function showToast(msg) {
      const t = document.getElementById("toastEl");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove("show"), 2200);
    }

    async function loadSavedLibrary() {
      await openDB();
      const savedTracks = await dbGetAll("tracks");
      tracks = savedTracks.map((t, idx) => ({
        ...t,
        url: URL.createObjectURL(t.blob),
        colors: t.colors || palettes[idx % palettes.length]
      }));

      playlists = await dbGetAll("playlists");

      // Restore linked Download folder handle if supported
      const settings = await dbGetAll("settings");
      const dirSetting = settings.find(s => s.key === "downloadDir");
      if (dirSetting && dirSetting.handle) {
        directoryHandle = dirSetting.handle;
        scanLinkedDirectory(true);
      }

      renderAllViews();
      if (tracks.length > 0) {
        loadTrackByIndex(0, false);
      }
    }

    async function ingestAudioFiles(fileList, silent = false) {
      const audioFiles = Array.from(fileList).filter(f =>
        f.type.startsWith("audio/") || /\.(mp3|m4a|wav|flac|ogg|aac)$/i.test(f.name)
      );
      if (!audioFiles.length) return;

      let addedCount = 0;
      for (const file of audioFiles) {
        const trackId = `${file.name}_${file.size}`;
        if (tracks.some(t => t.id === trackId)) continue;

        const cleanName = file.name.replace(/\.[^/.]+$/, "").replace(/[_-]/g, " ");
        const colors = palettes[(tracks.length + addedCount) % palettes.length];
        const trackRecord = {
          id: trackId,
          title: cleanName,
          artist: "Downloaded Audio",
          blob: file,
          colors
        };

        await dbPut("tracks", trackRecord);
        tracks.unshift({
          ...trackRecord,
          url: URL.createObjectURL(file)
        });
        addedCount++;
      }

      if (addedCount > 0) {
        renderAllViews();
        if (currentTrackIndex === -1 && tracks.length > 0) {
          loadTrackByIndex(0, false);
        }
        if (!silent) showToast(`${addedCount} new song${addedCount > 1 ? "s" : ""} synced`);
      }
    }

    // Link Downloads Folder for Automatic Chrome Download Detection
    async function linkDownloadsFolder() {
      if ("showDirectoryPicker" in window) {
        try {
          directoryHandle = await window.showDirectoryPicker({ mode: "read" });
          await dbPut("settings", { key: "downloadDir", handle: directoryHandle });
          await scanLinkedDirectory(false);
          return;
        } catch (err) {
          // Fallback if cancelled or restricted in WebView
        }
      }
      // Fallback for mobile WebViews: trigger directory/file selector
      document.getElementById("hiddenFileInput").click();
    }

    async function scanLinkedDirectory(silent = true) {
      if (!directoryHandle) return;
      try {
        const perm = await directoryHandle.queryPermission({ mode: "read" });
        if (perm !== "granted") {
          if (silent) return;
          const req = await directoryHandle.requestPermission({ mode: "read" });
          if (req !== "granted") return;
        }
        const files = [];
        for await (const entry of directoryHandle.values()) {
          if (entry.kind === "file" && /\.(mp3|m4a|wav|flac|ogg|aac)$/i.test(entry.name)) {
            const file = await entry.getFile();
            files.push(file);
          }
        }
        await ingestAudioFiles(files, silent);
      } catch (e) {
        console.warn("Directory scan skipped:", e);
      }
    }

    // Auto-check for new Chrome downloads whenever user switches back to the app
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        scanLinkedDirectory(false);
      }
    });
    setInterval(() => scanLinkedDirectory(true), 5000);

    document.getElementById("syncStorageBtn").addEventListener("click", linkDownloadsFolder);
    document.getElementById("hiddenFileInput").addEventListener("change", e => {
      ingestAudioFiles(e.target.files, false);
      e.target.value = "";
    });
    document.getElementById("hiddenFolderInput").addEventListener("change", e => {
      ingestAudioFiles(e.target.files, false);
      e.target.value = "";
    });
    /**************************************************************
     * 2. CLOCK-STYLE LIQUID GLASS PILL + 1:1 HAND-PROPORTIONAL SWIPE
     **************************************************************/
    const segmentedBar = document.getElementById("segmentedBar");
    const segmentPill = document.getElementById("segmentPill");
    const segmentBtns = Array.from(segmentedBar.querySelectorAll(".segment-btn"));
    const viewsViewport = document.getElementById("viewsViewport");
    const viewsTrack = document.getElementById("viewsTrack");

    let activeTab = 0; // 0: Tracks, 1: Playlists, 2: Queue
    let barRect = null;
    let isDraggingBar = false;

    function setTabProgress(progress, withTransition = false, popPill = false) {
      // Clamp with subtle rubber-banding at edges
      const clamped = Math.max(-0.08, Math.min(2.08, progress));

      if (withTransition) {
        segmentPill.style.transition = "transform 0.44s cubic-bezier(0.22, 1, 0.36, 1), background 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease";
        viewsTrack.style.transition = "transform 0.44s cubic-bezier(0.22, 1, 0.36, 1)";
      } else {
        segmentPill.style.transition = "background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease";
        viewsTrack.style.transition = "none";
      }

      const scaleX = popPill ? 1.07 : 1;
      const scaleY = popPill ? 1.18 : 1;
      segmentPill.classList.toggle("pop", popPill);

      segmentPill.style.transform = `translate3d(${clamped * 100}%, 0, 0) scale3d(${scaleX}, ${scaleY}, 1)`;
      viewsTrack.style.transform = `translate3d(${-clamped * 33.333333}%, 0, 0)`;

      const nearest = Math.round(Math.max(0, Math.min(2, clamped)));
      segmentBtns.forEach((btn, i) => btn.classList.toggle("active", i === nearest));
    }

    function snapToTab(index) {
      activeTab = Math.max(0, Math.min(2, index));
      // Brief pop-up pulse even on quick tap (just like Clock app)
      segmentPill.classList.add("pop");
      setTabProgress(activeTab, true, true);
      setTimeout(() => {
        if (!isDraggingBar && !isSwipingPage) {
          setTabProgress(activeTab, true, false);
        }
      }, 190);
    }

    // 1:1 Proportional Touch/Pointer Drag on the Segmented Bar
    function onBarPointerDown(clientX) {
      barRect = segmentedBar.getBoundingClientRect();
      isDraggingBar = true;
      updateBarFromPointer(clientX, true);
    }

    function updateBarFromPointer(clientX, firstTouch = false) {
      if (!isDraggingBar || !barRect) return;
      const pillWidth = (barRect.width - 8) / 3;
      const relX = clientX - barRect.left - 4 - pillWidth / 2;
      const maxTravel = (barRect.width - 8) - pillWidth;
      const progress = maxTravel > 0 ? relX / pillWidth : 0;
      setTabProgress(progress, firstTouch, true);
    }

    function onBarPointerUp(clientX) {
      if (!isDraggingBar || !barRect) return;
      isDraggingBar = false;
      const relX = clientX - barRect.left;
      const targetTab = Math.floor((relX / barRect.width) * 3);
      snapToTab(targetTab);
    }

    segmentedBar.addEventListener("touchstart", e => {
      onBarPointerDown(e.touches[0].clientX);
    }, { passive: true });

    segmentedBar.addEventListener("touchmove", e => {
      updateBarFromPointer(e.touches[0].clientX, false);
    }, { passive: true });

    segmentedBar.addEventListener("touchend", e => {
      onBarPointerUp(e.changedTouches[0].clientX);
    }, { passive: true });

    segmentedBar.addEventListener("mousedown", e => {
      onBarPointerDown(e.clientX);
      const move = ev => updateBarFromPointer(ev.clientX, false);
      const up = ev => {
        onBarPointerUp(ev.clientX);
        window.removeEventListener("mousemove", move);
        window.removeEventListener("mouseup", up);
      };
      window.addEventListener("mousemove", move);
      window.addEventListener("mouseup", up);
    });

    // 1:1 Proportional Hand-Swipe Across the Main Content Pages
    let pageStartX = 0;
    let pageStartY = 0;
    let pageCurrentProgress = 0;
    let isSwipingPage = false;
    let directionLocked = null;

    viewsViewport.addEventListener("touchstart", e => {
      pageStartX = e.touches[0].clientX;
      pageStartY = e.touches[0].clientY;
      pageCurrentProgress = activeTab;
      isSwipingPage = false;
      directionLocked = null;
    }, { passive: true });

    viewsViewport.addEventListener("touchmove", e => {
      const dx = e.touches[0].clientX - pageStartX;
      const dy = e.touches[0].clientY - pageStartY;

      if (!directionLocked) {
        if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
          directionLocked = Math.abs(dx) > Math.abs(dy) ? "horizontal" : "vertical";
        }
      }

      if (directionLocked === "horizontal") {
        isSwipingPage = true;
        const width = viewsViewport.clientWidth || 360;
        const deltaTabs = -dx / width;
        pageCurrentProgress = activeTab + deltaTabs;
        setTabProgress(pageCurrentProgress, false, true);
      }
    }, { passive: true });

    viewsViewport.addEventListener("touchend", e => {
      if (!isSwipingPage) return;
      isSwipingPage = false;
      const dx = e.changedTouches[0].clientX - pageStartX;
      const width = viewsViewport.clientWidth || 360;
      let target = activeTab;
      if (dx < -width * 0.22) target = activeTab + 1;
      else if (dx > width * 0.22) target = activeTab - 1;
      else target = Math.round(pageCurrentProgress);
      snapToTab(target);
    }, { passive: true });

    /**************************************************************
     * 3. RENDER TRACKS, PLAYLISTS, QUEUE & CONTEXT MENUS
     **************************************************************/
    const playSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
    const pauseSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
    const musicSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>`;
    const dotsSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>`;

    function renderAllViews() {
      renderTracksView();
      renderPlaylistsView();
      renderQueueView();
      updatePlayIcons();
    }

    function renderTracksView() {
      const container = document.getElementById("tracksContainer");
      if (tracks.length === 0) {
        container.innerHTML = `
          <div class="empty-card glass">
            <div class="empty-icon">${musicSvg}</div>
            <h3>No Songs in Library</h3>
            <p>Link your Downloads folder once. Any song downloaded from Chrome will automatically appear here.</p>
            <button class="glass-action-btn" onclick="linkDownloadsFolder()">Link Downloads Folder</button>
          </div>
        `;
        return;
      }

      container.innerHTML = `<div class="track-list">${tracks.map((t, idx) => `
        <div class="track-item glass gpu ${idx === currentTrackIndex ? 'active' : ''}" onclick="selectTrack(${idx})">
          <div class="track-left">
            <div class="track-art" style="background: linear-gradient(135deg, ${t.colors[0]}, ${t.colors[1]})">
              ${musicSvg}
            </div>
            <div class="track-meta">
              <h4>${escapeHtml(t.title)}</h4>
              <p>${escapeHtml(t.artist)}</p>
            </div>
          </div>
          <button class="more-btn" onclick="openTrackMenu(event, '${t.id}')">${dotsSvg}</button>
        </div>
      `).join("")}</div>`;
    }

    function renderPlaylistsView() {
      const container = document.getElementById("playlistsContainer");
      const titleEl = document.getElementById("playlistViewTitle");
      const createBtn = document.getElementById("createPlaylistBtn");

      if (activePlaylistId) {
        const pl = playlists.find(p => p.id === activePlaylistId);
        if (!pl) {
          activePlaylistId = null;
          return renderPlaylistsView();
        }
        titleEl.textContent = pl.name;
        createBtn.textContent = "← Back";
        const plTracks = pl.trackIds.map(id => tracks.find(t => t.id === id)).filter(Boolean);

        if (plTracks.length === 0) {
          container.innerHTML = `
            <div class="empty-card glass">
              <h3>Playlist is Empty</h3>
              <p>Tap ••• on any track in your Library to add songs to ${escapeHtml(pl.name)}.</p>
              <button class="glass-action-btn" onclick="deletePlaylist('${pl.id}')">Delete Playlist</button>
            </div>
          `;
          return;
        }

        container.innerHTML = `<div class="track-list">${plTracks.map(t => {
          const idx = tracks.findIndex(x => x.id === t.id);
          return `
            <div class="track-item glass gpu ${idx === currentTrackIndex ? 'active' : ''}" onclick="selectTrack(${idx})">
              <div class="track-left">
                <div class="track-art" style="background: linear-gradient(135deg, ${t.colors[0]}, ${t.colors[1]})">${musicSvg}</div>
                <div class="track-meta">
                  <h4>${escapeHtml(t.title)}</h4>
                  <p>${escapeHtml(t.artist)}</p>
                </div>
              </div>
              <button class="more-btn" onclick="removeTrackFromPlaylist(event, '${pl.id}', '${t.id}')">✕</button>
            </div>
          `;
        }).join("")}</div>`;
        return;
      }

      titleEl.textContent = "Playlists";
      createBtn.textContent = "+ New Playlist";

      if (playlists.length === 0) {
        container.innerHTML = `
          <div class="empty-card glass">
            <h3>No Playlists Yet</h3>
            <p>Create custom playlists to organize your favorite tracks.</p>
            <button class="glass-action-btn" onclick="openCreatePlaylistModal()">Create Playlist</button>
          </div>
        `;
        return;
      }

      container.innerHTML = `<div class="playlist-grid">${playlists.map((pl, idx) => {
        const c = palettes[idx % palettes.length];
        return `
          <div class="playlist-card glass gpu" onclick="openPlaylistDetail('${pl.id}')"
               style="background: linear-gradient(135deg, ${c[0]}33, ${c[1]}33)">
            <div class="playlist-card-top">
              <div class="playlist-icon">${musicSvg}</div>
            </div>
            <div>
              <h4>${escapeHtml(pl.name)}</h4>
              <p>${pl.trackIds.length} song${pl.trackIds.length === 1 ? "" : "s"}</p>
            </div>
          </div>
        `;
      }).join("")}</div>`;
    }

    function renderQueueView() {
      const container = document.getElementById("queueContainer");
      const queuedTracks = playQueue.map(id => tracks.find(t => t.id === id)).filter(Boolean);

      if (queuedTracks.length === 0) {
        container.innerHTML = `
          <div class="empty-card glass">
            <h3>Queue is Empty</h3>
            <p>Tap ••• on any song and choose "Add to Queue" to line up your next tracks.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = `<div class="track-list">${queuedTracks.map((t, qIdx) => `
        <div class="track-item glass gpu" onclick="playFromQueue(${qIdx})">
          <div class="track-left">
            <div class="track-art" style="background: linear-gradient(135deg, ${t.colors[0]}, ${t.colors[1]})">${musicSvg}</div>
            <div class="track-meta">
              <h4>${escapeHtml(t.title)}</h4>
              <p>Up Next #${qIdx + 1}</p>
            </div>
          </div>
          <button class="more-btn" onclick="removeFromQueue(event, ${qIdx})">✕</button>
        </div>
      `).join("")}</div>`;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    /**************************************************************
     * 4. DELETE, ADD TO QUEUE & PLAYLIST MODALS
     **************************************************************/
    const trackMenuModal = document.getElementById("trackMenuModal");
    const trackMenuSheet = document.getElementById("trackMenuSheet");

    function closeModal() {
      trackMenuModal.classList.remove("open");
    }

    trackMenuModal.addEventListener("click", e => {
      if (e.target === trackMenuModal) closeModal();
    });

    function openTrackMenu(e, trackId) {
      if (e) e.stopPropagation();
      const track = tracks.find(t => t.id === trackId);
      if (!track) return;

      trackMenuSheet.innerHTML = `
        <div class="sheet-track-header">
          <h4>${escapeHtml(track.title)}</h4>
          <p>${escapeHtml(track.artist)}</p>
        </div>
        <button class="sheet-option" onclick="addToQueue('${track.id}')">
          <span>Add to Queue</span>
        </button>
        <button class="sheet-option" onclick="showAddToPlaylistOptions('${track.id}')">
          <span>Add to Playlist</span>
        </button>
        <button class="sheet-option danger" onclick="deleteTrack('${track.id}')">
          <span>Delete from Library</span>
        </button>
      `;
      trackMenuModal.classList.add("open");
    }

    function addToQueue(trackId) {
      playQueue.push(trackId);
      closeModal();
      renderQueueView();
      showToast("Added to Queue");
    }

    function removeFromQueue(e, qIdx) {
      e.stopPropagation();
      playQueue.splice(qIdx, 1);
      renderQueueView();
    }

    function playFromQueue(qIdx) {
      const trackId = playQueue.splice(qIdx, 1)[0];
      const idx = tracks.findIndex(t => t.id === trackId);
      if (idx !== -1) selectTrack(idx);
      renderQueueView();
    }

    document.getElementById("clearQueueBtn").addEventListener("click", () => {
      playQueue = [];
      renderQueueView();
      showToast("Queue cleared");
    });

    async function deleteTrack(trackId) {
      closeModal();
      const idx = tracks.findIndex(t => t.id === trackId);
      if (idx === -1) return;

      const [removed] = tracks.splice(idx, 1);
      if (removed.url) URL.revokeObjectURL(removed.url);
      await dbDelete("tracks", trackId);

      // Clean up from playlists and queue
      playQueue = playQueue.filter(id => id !== trackId);
      for (const pl of playlists) {
        if (pl.trackIds.includes(trackId)) {
          pl.trackIds = pl.trackIds.filter(id => id !== trackId);
          await dbPut("playlists", pl);
        }
      }

      if (tracks.length === 0) {
        audio.pause();
        audio.src = "";
        isPlaying = false;
        currentTrackIndex = -1;
        document.getElementById("miniPlayer").classList.add("hidden");
        closeSheet();
      } else if (idx === currentTrackIndex) {
        loadTrackByIndex(idx % tracks.length, isPlaying);
      } else if (idx < currentTrackIndex) {
        currentTrackIndex--;
      }

      renderAllViews();
      showToast("Track deleted");
    }

    // Playlist Management
    function showAddToPlaylistOptions(trackId) {
      trackMenuSheet.innerHTML = `
        <div class="sheet-track-header">
          <h4>Select Playlist</h4>
          <p>Choose a playlist or create a new one</p>
        </div>
        ${playlists.map(pl => `
          <button class="sheet-option" onclick="addTrackToPlaylist('${pl.id}', '${trackId}')">
            <span>${escapeHtml(pl.name)} (${pl.trackIds.length})</span>
          </button>
        `).join("")}
        <button class="sheet-option" onclick="openCreatePlaylistModal('${trackId}')">
          <span>+ Create New Playlist</span>
        </button>
      `;
    }

    function openCreatePlaylistModal(trackIdToAutoAdd = null) {
      trackMenuSheet.innerHTML = `
        <div class="sheet-track-header">
          <h4>New Playlist</h4>
          <p>Enter a name for your playlist</p>
        </div>
        <input type="text" class="glass-input" id="playlistNameInput" placeholder="Playlist name..." maxlength="32" />
        <button class="sheet-option" id="confirmCreatePlaylistBtn">
          <span>Save Playlist</span>
        </button>
      `;
      trackMenuModal.classList.add("open");
      const input = document.getElementById("playlistNameInput");
      setTimeout(() => input.focus(), 80);

      document.getElementById("confirmCreatePlaylistBtn").onclick = async () => {
        const name = input.value.trim();
        if (!name) return;
        const newPl = {
          id: "pl_" + Date.now(),
          name,
          trackIds: trackIdToAutoAdd ? [trackIdToAutoAdd] : []
        };
        playlists.unshift(newPl);
        await dbPut("playlists", newPl);
        closeModal();
        renderPlaylistsView();
        showToast(`Playlist "${name}" created`);
      };
    }

    async function addTrackToPlaylist(playlistId, trackId) {
      const pl = playlists.find(p => p.id === playlistId);
      if (!pl) return;
      if (!pl.trackIds.includes(trackId)) {
        pl.trackIds.push(trackId);
        await dbPut("playlists", pl);
      }
      closeModal();
      renderPlaylistsView();
      showToast(`Added to ${pl.name}`);
    }

    async function removeTrackFromPlaylist(e, playlistId, trackId) {
      e.stopPropagation();
      const pl = playlists.find(p => p.id === playlistId);
      if (!pl) return;
      pl.trackIds = pl.trackIds.filter(id => id !== trackId);
      await dbPut("playlists", pl);
      renderPlaylistsView();
    }

    async function deletePlaylist(playlistId) {
      playlists = playlists.filter(p => p.id !== playlistId);
      await dbDelete("playlists", playlistId);
      activePlaylistId = null;
      renderPlaylistsView();
      showToast("Playlist deleted");
    }

    function openPlaylistDetail(playlistId) {
      activePlaylistId = playlistId;
      renderPlaylistsView();
    }

    document.getElementById("createPlaylistBtn").addEventListener("click", () => {
      if (activePlaylistId) {
        activePlaylistId = null;
        renderPlaylistsView();
      } else {
        openCreatePlaylistModal();
      }
    });

    /**************************************************************
     * 5. WEB AUDIO ENGINE, BACKGROUND PLAYBACK & BEAT MATCHING
     **************************************************************/
    const audio = new Audio();
    audio.playsInline = true;

    let audioCtx = null;
    let analyser = null;
    let dataArray = null;
    let currentTrackIndex = -1;
    let isPlaying = false;

    const orb1El = document.getElementById("orb1");
    const orb2El = document.getElementById("orb2");
    const mainArtEl = document.getElementById("mainArt");
    const miniArtEl = document.getElementById("miniArt");
    const artGlowRingEl = document.getElementById("artGlowRing");
    const canvas = document.getElementById("beatCanvas");
    const ctx = canvas.getContext("2d", { alpha: true, desynchronized: true });
    let cachedGrad = null;

    function initAudioEngine() {
      if (audioCtx) return;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
      const source = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;
      analyser.smoothingTimeConstant = 0.72;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
    }

    function updateCanvasGradient(colors) {
      cachedGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      cachedGrad.addColorStop(0, colors[0]);
      cachedGrad.addColorStop(1, colors[2]);
    }

    function loadTrackByIndex(index, autoPlay = false) {
      if (!tracks.length) return;
      currentTrackIndex = (index + tracks.length) % tracks.length;
      const track = tracks[currentTrackIndex];
      audio.src = track.url;

      document.documentElement.style.setProperty("--accent-1", track.colors[0]);
      document.documentElement.style.setProperty("--accent-2", track.colors[1]);
      document.documentElement.style.setProperty("--accent-3", track.colors[2]);

      const grad = `linear-gradient(135deg, ${track.colors[0]}, ${track.colors[1]})`;
      miniArtEl.style.background = grad;
      mainArtEl.style.background = grad;

      document.getElementById("miniTitle").textContent = track.title;
      document.getElementById("miniArtist").textContent = track.artist;
      document.getElementById("npTitle").textContent = track.title;
      document.getElementById("npArtist").textContent = track.artist;

      if (!sheetOpen) {
        document.getElementById("miniPlayer").classList.remove("hidden");
      }

      updateCanvasGradient(track.colors);
      renderAllViews();

      if ("mediaSession" in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title,
          artist: track.artist
        });
        navigator.mediaSession.setActionHandler("play", () => togglePlay());
        navigator.mediaSession.setActionHandler("pause", () => togglePlay());
        navigator.mediaSession.setActionHandler("previoustrack", () => playPrev());
        navigator.mediaSession.setActionHandler("nexttrack", () => playNext());
      }

      if (autoPlay) playAudio();
    }

    function selectTrack(index) {
      initAudioEngine();
      loadTrackByIndex(index, true);
    }

    async function playAudio() {
      if (!tracks.length) return linkDownloadsFolder();
      initAudioEngine();
      if (audioCtx.state === "suspended") await audioCtx.resume();
      try {
        await audio.play();
        isPlaying = true;
        updatePlayIcons();
      } catch (e) {}
    }

    function pauseAudio() {
      audio.pause();
      isPlaying = false;
      updatePlayIcons();
    }

    function togglePlay() {
      if (isPlaying) pauseAudio();
      else playAudio();
    }

    function playNext() {
      if (playQueue.length > 0) {
        const nextId = playQueue.shift();
        const idx = tracks.findIndex(t => t.id === nextId);
        renderQueueView();
        if (idx !== -1) return loadTrackByIndex(idx, true);
      }
      loadTrackByIndex(currentTrackIndex + 1, true);
    }

    function playPrev() {
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
      } else {
        loadTrackByIndex(currentTrackIndex - 1, true);
      }
    }

    audio.addEventListener("ended", playNext);

    function updatePlayIcons() {
      const icon = isPlaying ? pauseSvg : playSvg;
      document.getElementById("miniPlayBtn").innerHTML = icon;
      document.getElementById("mainPlayBtn").innerHTML = icon;
    }

    // Real-Time Hardware-Accelerated Beat Loop
    let smoothBass = 0;
    function beatLoop() {
      requestAnimationFrame(beatLoop);

      if (!analyser || !isPlaying) {
        if (smoothBass > 0.002) {
          smoothBass *= 0.85;
          mainArtEl.style.transform = `translate3d(0,0,0) scale3d(1,1,1)`;
          miniArtEl.style.transform = `translate3d(0,0,0) scale3d(1,1,1)`;
        }
        return;
      }

      analyser.getByteFrequencyData(dataArray);
      const rawBass = (dataArray[0] + dataArray[1] + dataArray[2] + dataArray[3]) / (4 * 255);
      smoothBass += (rawBass - smoothBass) * 0.36;

      const artScale = 1 + Math.pow(smoothBass, 1.35) * 0.16;
      const orbScale = 1 + smoothBass * 0.22;
      const glowScale = 1 + smoothBass * 0.35;

      mainArtEl.style.transform = `translate3d(0, 0, 0) scale3d(${artScale}, ${artScale}, 1)`;
      miniArtEl.style.transform = `translate3d(0, 0, 0) scale3d(${1 + smoothBass * 0.12}, ${1 + smoothBass * 0.12}, 1)`;
      artGlowRingEl.style.transform = `translate3d(0, 0, 0) scale3d(${glowScale}, ${glowScale}, 1)`;
      artGlowRingEl.style.opacity = (0.2 + smoothBass * 0.65).toFixed(2);

      orb1El.style.transform = `translate3d(0, 0, 0) scale3d(${orbScale}, ${orbScale}, 1)`;
      orb2El.style.transform = `translate3d(0, 0, 0) scale3d(${orbScale * 1.04}, ${orbScale * 1.04}, 1)`;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (cachedGrad) ctx.fillStyle = cachedGrad;

      const barCount = 24;
      const step = canvas.width / barCount;
      const barWidth = step - 5;

      ctx.beginPath();
      for (let i = 0; i < barCount; i++) {
        const percent = (dataArray[i] || 0) / 255;
        const h = Math.max(4, percent * (canvas.height - 6));
        const x = i * step + 2;
        const y = (canvas.height - h) * 0.5;
        ctx.roundRect(x, y, barWidth, h, 4);
      }
      ctx.fill();
    }

    /**************************************************************
     * 6. 1:1 PROPORTIONAL NOW-PLAYING SHEET & MINI-PLAYER DRAG
     **************************************************************/
    const sheet = document.getElementById("nowPlayingSheet");
    const miniPlayer = document.getElementById("miniPlayer");
    let sheetOpen = false;
    let dragStartY = 0;
    let currentTranslateY = 0;
    let isDraggingSheet = false;

    function openSheet() {
      sheetOpen = true;
      sheet.style.transition = "transform 0.46s cubic-bezier(0.22, 1, 0.36, 1)";
      sheet.style.transform = "translate3d(0, 0%, 0)";
      miniPlayer.classList.add("hidden");
    }

    function closeSheet() {
      sheetOpen = false;
      sheet.style.transition = "transform 0.46s cubic-bezier(0.22, 1, 0.36, 1)";
      sheet.style.transform = "translate3d(0, 105%, 0)";
      if (tracks.length > 0) miniPlayer.classList.remove("hidden");
    }

    document.getElementById("miniOpenArea").addEventListener("click", openSheet);
    document.getElementById("closeSheetBtn").addEventListener("click", closeSheet);

    // 1:1 Finger Drag-Down on Fullscreen Player
    sheet.addEventListener("touchstart", e => {
      if (e.target.id === "seekSlider") return;
      dragStartY = e.touches[0].clientY;
      currentTranslateY = 0;
      isDraggingSheet = true;
      sheet.style.transition = "none";
    }, { passive: true });

    sheet.addEventListener("touchmove", e => {
      if (!isDraggingSheet) return;
      const dy = e.touches[0].clientY - dragStartY;
      if (dy > 0) {
        currentTranslateY = dy;
        sheet.style.transform = `translate3d(0, ${dy}px, 0)`;
      }
    }, { passive: true });

    sheet.addEventListener("touchend", () => {
      if (!isDraggingSheet) return;
      isDraggingSheet = false;
      if (currentTranslateY > 95) closeSheet();
      else openSheet();
    }, { passive: true });

    // 1:1 Finger Drag-Up on Mini-Player
    let miniStartY = 0;
    let isDraggingMini = false;

    miniPlayer.addEventListener("touchstart", e => {
      miniStartY = e.touches[0].clientY;
      isDraggingMini = true;
      sheet.style.transition = "none";
    }, { passive: true });

    miniPlayer.addEventListener("touchmove", e => {
      if (!isDraggingMini) return;
      const dy = e.touches[0].clientY - miniStartY;
      if (dy < -8) {
        const vh = window.innerHeight || 700;
        const offsetPx = Math.max(0, vh + dy);
        sheet.style.transform = `translate3d(0, ${offsetPx}px, 0)`;
      }
    }, { passive: true });

    miniPlayer.addEventListener("touchend", e => {
      if (!isDraggingMini) return;
      isDraggingMini = false;
      const dy = e.changedTouches[0].clientY - miniStartY;
      if (dy < -45) openSheet();
      else closeSheet();
    }, { passive: true });

    // Controls
    document.getElementById("miniPlayBtn").addEventListener("click", e => {
      e.stopPropagation();
      togglePlay();
    });
    document.getElementById("miniNextBtn").addEventListener("click", e => {
      e.stopPropagation();
      playNext();
    });
    document.getElementById("mainPlayBtn").addEventListener("click", togglePlay);
    document.getElementById("prevBtn").addEventListener("click", playPrev);
    document.getElementById("nextBtn").addEventListener("click", playNext);
    document.getElementById("npMoreBtn").addEventListener("click", () => {
      if (currentTrackIndex !== -1 && tracks[currentTrackIndex]) {
        openTrackMenu(null, tracks[currentTrackIndex].id);
      }
    });

    // Seek Bar
    const seekSlider = document.getElementById("seekSlider");
    function formatTime(sec) {
      if (!isFinite(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    audio.addEventListener("timeupdate", () => {
      if (audio.duration) {
        seekSlider.value = (audio.currentTime / audio.duration) * 100;
        document.getElementById("currentTimeEl").textContent = formatTime(audio.currentTime);
        document.getElementById("totalTimeEl").textContent = formatTime(audio.duration);
      }
    });

    seekSlider.addEventListener("input", () => {
      if (audio.duration) {
        audio.currentTime = (seekSlider.value / 100) * audio.duration;
      }
    });

    // Initialize
    loadSavedLibrary();
    requestAnimationFrame(beatLoop);
  </script>
</body>
</html>
