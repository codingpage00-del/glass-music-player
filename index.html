<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#12071f" id="metaThemeColor" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Glass Music Player" />
  <title>Glass Music Player</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="https://cdn-icons-png.flaticon.com/512/3844/3844724.png" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3844/3844724.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --theme-r: 217;
      --theme-g: 70;
      --theme-b: 239;
      --theme-primary: #ec4899;
      --theme-secondary: #a855f7;
      --bg-Base: #12061c;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: var(--bg-Base);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      transition: background-color 0.95s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Full-Screen Dynamic Animated Background Wash */
    #dynamicBgWash {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 15%, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.34) 0%, transparent 58%),
        radial-gradient(circle at 82% 78%, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.26) 0%, transparent 62%),
        radial-gradient(circle at 50% 50%, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.12) 0%, rgba(6, 4, 12, 0.96) 100%);
      transition: background 0.95s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .gpu {
      will-change: transform, opacity;
      transform: translate3d(0, 0, 0);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    /* Ambient Glowing Orbs with Smooth Color Morphing */
    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(95px);
      pointer-events: none;
      z-index: 0;
      transition: background-color 1s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Ultra-Clean & Soft Track Cards */
    .smooth-card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.028));
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.14), 0 8px 24px rgba(0, 0, 0, 0.22);
      contain: paint layout;
      transition:
        transform 0.38s cubic-bezier(0.22, 1, 0.36, 1),
        background 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.32s ease;
    }
    .smooth-card:active {
      transform: scale3d(0.975, 0.975, 1);
    }
    .smooth-card.active-track {
      background: linear-gradient(145deg, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.22), rgba(255, 255, 255, 0.05));
      border-color: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.48);
      box-shadow:
        inset 0 1.5px 2px rgba(255, 255, 255, 0.22),
        0 10px 28px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.18);
    }

    /* Main Frosted Glass Surfaces */
    .glass-surface {
      background: rgba(18, 12, 28, 0.72);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.6), inset 0 1.5px 2px rgba(255, 255, 255, 0.18);
      transition: border-color 0.6s ease, box-shadow 0.6s ease;
    }

    /* Liquid Glass Segmented Pill */
    .segment-pill-outer {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: calc((100% - 8px) / 3);
      pointer-events: none;
      will-change: transform;
      transition: transform 0.48s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .segment-pill-outer.dragging {
      transition: none;
    }
    .segment-pill-inner {
      width: 100%;
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(135deg, var(--theme-primary), var(--theme-secondary));
      box-shadow:
        inset 0 1.5px 2.5px rgba(255, 255, 255, 0.6),
        0 4px 20px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.55);
      will-change: transform;
      transition:
        transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1),
        background 0.8s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .segment-pill-inner.pop {
      transform: scale3d(1.05, 1.14, 1);
    }

    .tactile-btn {
      transition: transform 0.26s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.25s ease;
    }
    .tactile-btn:active {
      transform: scale3d(0.88, 0.88, 1);
    }

    .scroll-container {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
    }
    .scroll-container::-webkit-scrollbar {
      display: none;
    }

    /* Smooth List Entry Animation */
    @keyframes softSlideUp {
      from {
        opacity: 0;
        transform: translate3d(0, 12px, 0) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }
    .track-enter {
      animation: softSlideUp 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Now Playing Bottom Sheet */
    #nowPlayingSheet {
      will-change: transform;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      padding-top: calc(1.25rem + var(--safe-top));
      padding-bottom: calc(1.5rem + var(--safe-bottom));
    }
    #nowPlayingSheet.dragging {
      transition: none;
    }

    /* 3-Dot Action Sheet Transition */
    #trackActionModalContent {
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
    }
  </style>
</head>
<body class="relative flex flex-col justify-between select-none">

  <!-- Full-Screen Dynamic Background Wash -->
  <div id="dynamicBgWash"></div>

  <!-- Bass-Reactive Ambient Orbs -->
  <div id="ambientOrb1" class="ambient-orb gpu w-80 h-80 -top-16 -left-16" style="background-color: rgba(236, 72, 153, 0.35);"></div>
  <div id="ambientOrb2" class="ambient-orb gpu w-96 h-96 bottom-12 -right-20" style="background-color: rgba(168, 85, 247, 0.28);"></div>

  <!-- Main Content Shell -->
  <main class="relative z-10 flex-1 flex flex-col max-w-md mx-auto w-full px-4 overflow-hidden"
        style="padding-top: calc(1.25rem + var(--safe-top)); padding-bottom: calc(6.5rem + var(--safe-bottom));">

    <!-- Clean Top Header (Download/Upload Icons Removed, Only Auto-Sync Pill Kept) -->
    <header class="flex items-center justify-between mb-5 shrink-0">
      <div class="flex items-center gap-3.5">
        <div id="headerLogoBox"
             class="w-11 h-11 rounded-full flex items-center justify-center shadow-inner transition-all duration-700"
             style="background: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.2); border: 1px solid rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.4);">
          <svg class="w-5 h-5 text-white/90" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Library</h1>
      </div>

      <!-- Auto-Sync Pill (Tap to seamlessly sync new local audio files) -->
      <label class="tactile-btn px-3.5 py-1.5 rounded-full bg-emerald-950/65 border border-emerald-500/35 flex items-center gap-2 text-xs font-semibold text-emerald-300 cursor-pointer shadow-sm"
             title="Auto-Sync Active (Tap to sync local audio files)">
        <input type="file" id="audioUploadInput" accept="audio/*" multiple class="hidden" />
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        Auto-Sync
      </label>
    </header>

    <!-- Segmented Bar (Tracks | Playlists | Queue) -->
    <div id="segmentedBar" class="relative p-1 rounded-full bg-white/[0.055] border border-white/10 flex items-center mb-5 shrink-0 touch-none cursor-pointer">
      <div id="segmentPillOuter" class="segment-pill-outer gpu">
        <div id="segmentPillInner" class="segment-pill-inner"></div>
      </div>
      <button type="button" data-tab="0" class="seg-btn relative z-10 flex-1 py-2.5 text-xs font-semibold text-white text-center transition-colors">Tracks</button>
      <button type="button" data-tab="1" class="seg-btn relative z-10 flex-1 py-2.5 text-xs font-semibold text-white/60 text-center transition-colors">Playlists</button>
      <button type="button" data-tab="2" class="seg-btn relative z-10 flex-1 py-2.5 text-xs font-semibold text-white/60 text-center transition-colors">Queue</button>
    </div>

    <!-- Track / Playlist / Queue List Container -->
    <div id="viewContainer" class="scroll-container flex-1 space-y-3 pr-0.5"></div>
  </main>

  <!-- Floating Glass Mini-Player -->
  <div id="miniPlayer"
       class="fixed left-4 right-4 max-w-md mx-auto z-20 glass-surface rounded-3xl p-3 flex items-center justify-between cursor-pointer gpu"
       style="bottom: calc(0.85rem + var(--safe-bottom));">
    <div class="flex items-center gap-3.5 min-w-0">
      <div id="miniArt"
           class="gpu w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg shrink-0 transition-all duration-700"
           style="background: linear-gradient(135deg, var(--theme-primary), var(--theme-secondary));">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
        </svg>
      </div>
      <div class="truncate">
        <p id="miniTitle" class="text-sm font-semibold text-white truncate">Cyber Pulse (Synthwave)</p>
        <p id="miniArtist" class="text-xs text-white/60 truncate mt-0.5">Liquid Glass Audio</p>
      </div>
    </div>
    <div class="flex items-center gap-2 shrink-0 pr-1">
      <button id="miniPlayBtn" class="tactile-btn w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white">
        <svg id="miniPlayIcon" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="miniNextBtn" class="tactile-btn w-9 h-9 rounded-full bg-white/5 flex items-center justify-center text-white/80">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
  </div>

  <!-- Full Now Playing Sheet -->
  <div id="nowPlayingSheet" class="fixed inset-0 z-30 glass-surface flex flex-col justify-between px-6 translate-y-full max-w-md mx-auto touch-none">
    <div id="sheetDragHeader" class="flex flex-col items-center pt-1 pb-2 cursor-grab">
      <div class="w-10 h-1.5 rounded-full bg-white/25 mb-3"></div>
      <div class="w-full flex items-center justify-between">
        <button id="closeSheetBtn" class="tactile-btn w-10 h-10 rounded-full smooth-card flex items-center justify-center text-white/80">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        <span class="text-[11px] uppercase tracking-widest text-white/50 font-semibold">Now Playing</span>
        <div class="w-10"></div>
      </div>
    </div>

    <!-- Reactive Artwork & 24-Bar Visualizer -->
    <div class="flex flex-col items-center my-auto">
      <div class="relative flex items-center justify-center mb-7">
        <div id="npArtGlowRing"
             class="gpu absolute w-56 h-56 rounded-full blur-2xl opacity-40 transition-colors duration-700"
             style="background: var(--theme-primary);"></div>
        <div id="npMainArt"
             class="gpu relative w-52 h-52 rounded-3xl flex items-center justify-center shadow-2xl border border-white/20 transition-all duration-700"
             style="background: linear-gradient(135deg, var(--theme-primary), var(--theme-secondary));">
          <svg class="w-20 h-20 text-white/95" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
          </svg>
        </div>
      </div>

      <h2 id="npTitle" class="text-xl font-bold text-center mb-1 truncate max-w-full">Cyber Pulse (Synthwave)</h2>
      <p id="npArtist" class="text-sm text-white/60 text-center mb-5">Liquid Glass Audio</p>

      <canvas id="visualizerCanvas" class="w-72 h-12 mb-5"></canvas>

      <div class="w-full space-y-1.5">
        <input id="seekBar" type="range" min="0" max="100" value="0" step="0.1" class="w-full h-1.5 bg-white/15 rounded-lg cursor-pointer" style="accent-color: var(--theme-primary);" />
        <div class="flex justify-between text-[11px] text-white/50 font-medium">
          <span id="currentTimeEl">0:00</span>
          <span id="durationTimeEl">SYNTH DEMO</span>
        </div>
      </div>
    </div>

    <!-- Playback Controls -->
    <div class="flex items-center justify-center gap-7 pb-2">
      <button id="prevBtn" class="tactile-btn w-12 h-12 rounded-full smooth-card flex items-center justify-center text-white">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button id="playBtn"
              class="tactile-btn w-16 h-16 rounded-full flex items-center justify-center text-white shadow-xl transition-all duration-700"
              style="background: linear-gradient(135deg, var(--theme-primary), var(--theme-secondary)); box-shadow: 0 10px 28px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.45);">
        <svg id="npPlayIcon" class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="nextBtn" class="tactile-btn w-12 h-12 rounded-full smooth-card flex items-center justify-center text-white">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
  </div>

  <!-- 3-Dots (⋮) Song Options Modal (Add to Queue, Make a New Playlist, Delete) -->
  <div id="trackActionModal" class="fixed inset-0 z-50 bg-black/65 backdrop-blur-md hidden items-end sm:items-center justify-center p-4">
    <div id="trackActionModalContent" class="glass-surface rounded-3xl p-5 w-full max-w-sm space-y-3 border border-white/15 translate-y-4 opacity-0">
      <!-- Selected Track Info Header -->
      <div class="flex items-center gap-3.5 pb-3 border-b border-white/10">
        <div id="menuTrackIcon" class="w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 shadow-md">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
          </svg>
        </div>
        <div class="min-w-0 flex-1">
          <h4 id="menuTrackTitle" class="text-sm font-bold text-white truncate">Track Title</h4>
          <p id="menuTrackArtist" class="text-xs text-white/60 truncate">Artist</p>
        </div>
        <button onclick="closeTrackMenu()" class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-white/60 text-lg">&times;</button>
      </div>

      <!-- Menu Action Buttons -->
      <div class="space-y-2 pt-1">
        <!-- 1. Add to Queue -->
        <button id="menuAddToQueueBtn" class="tactile-btn w-full p-3.5 rounded-2xl smooth-card flex items-center gap-3.5 text-left text-sm font-semibold text-white">
          <div class="w-9 h-9 rounded-xl bg-fuchsia-500/20 border border-fuchsia-400/30 flex items-center justify-center text-fuchsia-300">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h7m4 0h6m-3-3v6"/>
            </svg>
          </div>
          <div>
            <p class="text-sm font-semibold">Add to Queue</p>
            <p class="text-[11px] text-white/50 font-normal">Play next in your active queue</p>
          </div>
        </button>

        <!-- 2. Make a New Playlist -->
        <button id="menuNewPlaylistBtn" class="tactile-btn w-full p-3.5 rounded-2xl smooth-card flex items-center gap-3.5 text-left text-sm font-semibold text-white">
          <div class="w-9 h-9 rounded-xl bg-indigo-500/20 border border-indigo-400/30 flex items-center justify-center text-indigo-300">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
            </svg>
          </div>
          <div>
            <p class="text-sm font-semibold">Make a New Playlist</p>
            <p class="text-[11px] text-white/50 font-normal">Create a custom playlist with this song</p>
          </div>
        </button>

        <!-- Inline New Playlist Input Box (Hidden until tapped) -->
        <div id="inlinePlaylistBox" class="hidden p-3 rounded-2xl bg-white/5 border border-white/10 space-y-2.5">
          <input id="inlinePlaylistInput" type="text" placeholder="Enter playlist name..."
                 class="w-full px-3.5 py-2.5 rounded-xl bg-black/40 border border-white/15 text-xs text-white placeholder-white/40 focus:outline-none focus:border-fuchsia-400" />
          <div class="flex gap-2">
            <button id="saveInlinePlaylistBtn" class="tactile-btn flex-1 py-2 rounded-xl bg-gradient-to-r from-fuchsia-500 to-purple-600 text-xs font-bold text-white">
              Create & Add
            </button>
            <button onclick="document.getElementById('inlinePlaylistBox').classList.add('hidden')" class="tactile-btn px-4 py-2 rounded-xl bg-white/10 text-xs text-white/70">
              Cancel
            </button>
          </div>
        </div>

        <!-- 3. Delete Track -->
        <button id="menuDeleteTrackBtn" class="tactile-btn w-full p-3.5 rounded-2xl smooth-card flex items-center gap-3.5 text-left text-sm font-semibold text-rose-400">
          <div class="w-9 h-9 rounded-xl bg-rose-500/20 border border-rose-400/30 flex items-center justify-center text-rose-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
          </div>
          <div>
            <p class="text-sm font-semibold text-rose-400">Delete Song</p>
            <p class="text-[11px] text-rose-300/60 font-normal">Remove from library & storage</p>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- Soft Floating Toast Notification -->
  <div id="toastBanner" class="fixed top-14 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-full glass-surface text-xs font-semibold text-white shadow-xl pointer-events-none opacity-0 transition-all duration-300 scale-95">
    Action completed
  </div>

  <script>
    /********************************************************************
     * Service Worker Registration for PWA
     ********************************************************************/
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    /********************************************************************
     * Distinct Color Palettes for Every Song + Smooth Background Morph
     ********************************************************************/
    const COLOR_PALETTES = [
      {
        name: "pink",
        primary: "#ec4899",
        secondary: "#d946ef",
        rgb: [236, 72, 153],
        bgBase: "#16061b"
      },
      {
        name: "purple",
        primary: "#6366f1",
        secondary: "#8b5cf6",
        rgb: [99, 102, 241],
        bgBase: "#0a0820"
      },
      {
        name: "green",
        primary: "#10b981",
        secondary: "#0d9488",
        rgb: [16, 185, 129],
        bgBase: "#041814"
      },
      {
        name: "amber",
        primary: "#f59e0b",
        secondary: "#ea580c",
        rgb: [245, 158, 11],
        bgBase: "#1a0e04"
      },
      {
        name: "cyan",
        primary: "#06b6d4",
        secondary: "#3b82f6",
        rgb: [6, 182, 212],
        bgBase: "#04151f"
      },
      {
        name: "rose",
        primary: "#f43f5e",
        secondary: "#e11d48",
        rgb: [244, 63, 94],
        bgBase: "#1c050c"
      },
      {
        name: "violet",
        primary: "#a855f7",
        secondary: "#ec4899",
        rgb: [168, 85, 247],
        bgBase: "#130722"
      },
      {
        name: "lime",
        primary: "#84cc16",
        secondary: "#10b981",
        rgb: [132, 204, 22],
        bgBase: "#0c1805"
      }
    ];

    // Smooth RGB interpolation state for 120Hz canvas & ambient wash
    let currentRGB = [236, 72, 153];
    let targetRGB = [236, 72, 153];

    function applySongTheme(palette) {
      if (!palette) return;
      targetRGB = [...palette.rgb];
      const root = document.documentElement;
      root.style.setProperty("--theme-r", palette.rgb[0]);
      root.style.setProperty("--theme-g", palette.rgb[1]);
      root.style.setProperty("--theme-b", palette.rgb[2]);
      root.style.setProperty("--theme-primary", palette.primary);
      root.style.setProperty("--theme-secondary", palette.secondary);
      root.style.setProperty("--bg-Base", palette.bgBase);

      const metaTheme = document.getElementById("metaThemeColor");
      if (metaTheme) metaTheme.setAttribute("content", palette.bgBase);

      document.getElementById("ambientOrb1").style.backgroundColor = `rgba(${palette.rgb[0]}, ${palette.rgb[1]}, ${palette.rgb[2]}, 0.38)`;
      document.getElementById("ambientOrb2").style.backgroundColor = `rgba(${palette.rgb[0]}, ${palette.rgb[1]}, ${palette.rgb[2]}, 0.28)`;
    }

    /********************************************************************
     * Library State & IndexedDB Persistence (GlassMusicStorageDB)
     ********************************************************************/
    const DB_NAME = "GlassMusicStorageDB";
    const STORE_NAME = "tracks";
    let dbInstance = null;

    let tracks = [
      {
        id: "sample_1",
        title: "Cyber Pulse (Synthwave)",
        artist: "Liquid Glass Audio",
        sample: true,
        freq: 110,
        palette: COLOR_PALETTES[0] // Pink
      },
      {
        id: "sample_2",
        title: "Midnight Chill (Lo-Fi)",
        artist: "Aura Soundscapes",
        sample: true,
        freq: 86,
        palette: COLOR_PALETTES[1] // Purple
      },
      {
        id: "sample_3",
        title: "Starlight Drifts (Melodic)",
        artist: "Neon Horizon",
        sample: true,
        freq: 144,
        palette: COLOR_PALETTES[2] // Emerald Green
      }
    ];

    let queueList = [...tracks];
    let playlists = []; // [{ name: "Workout", tracks: [...] }]
    let activeTab = 0;
    let currentTrackIndex = 0;
    let isPlaying = false;
    let selectedMenuTrackId = null;

    const dbReq = indexedDB.open(DB_NAME, 1);
    dbReq.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: "id" });
      }
    };
    dbReq.onsuccess = (e) => {
      dbInstance = e.target.result;
      const tx = dbInstance.transaction(STORE_NAME, "readonly");
      tx.objectStore(STORE_NAME).getAll().onsuccess = (ev) => {
        const stored = ev.target.result || [];
        stored.forEach((item, idx) => {
          const blobUrl = URL.createObjectURL(item.blob);
          const palette = COLOR_PALETTES[(3 + idx) % COLOR_PALETTES.length];
          const newTrack = {
            id: item.id,
            title: item.title,
            artist: item.artist || "Local Audio",
            url: blobUrl,
            sample: false,
            palette
          };
          tracks.push(newTrack);
          queueList.push(newTrack);
        });
        renderCurrentView();
      };
    };

    // Auto-Sync File Import
    document.getElementById("audioUploadInput").addEventListener("change", (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      files.forEach((file) => {
        const id = "track_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
        const title = file.name.replace(/\.[^/.]+$/, "");
        const blobUrl = URL.createObjectURL(file);
        const palette = COLOR_PALETTES[tracks.length % COLOR_PALETTES.length];

        const newTrack = {
          id,
          title,
          artist: "Auto-Synced Audio",
          url: blobUrl,
          sample: false,
          palette
        };
        tracks.push(newTrack);
        queueList.push(newTrack);

        if (dbInstance) {
          const tx = dbInstance.transaction(STORE_NAME, "readwrite");
          tx.objectStore(STORE_NAME).put({ id, title, artist: "Auto-Synced Audio", blob: file });
        }
      });
      renderCurrentView();
      showToast(`Synced ${files.length} song${files.length > 1 ? 's' : ''}`);
    });

    /********************************************************************
     * Toast Helper
     ********************************************************************/
    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById("toastBanner");
      t.textContent = msg;
      t.classList.remove("opacity-0", "scale-95");
      t.classList.add("opacity-100", "scale-100");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        t.classList.remove("opacity-100", "scale-100");
        t.classList.add("opacity-0", "scale-95");
      }, 2100);
    }

    /********************************************************************
     * Singleton Web Audio API & Playback Engine
     ********************************************************************/
    const audioElement = new Audio();
    audioElement.crossOrigin = "anonymous";
    audioElement.playsInline = true;

    let audioCtx = null;
    let analyserNode = null;
    let sourceNodeRef = null;
    let freqDataArray = null;
    let synthOsc = null;
    let synthGain = null;

    function ensureAudioEngineReady() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        analyserNode = audioCtx.createAnalyser();
        analyserNode.fftSize = 64;
        analyserNode.smoothingTimeConstant = 0.82;
        freqDataArray = new Uint8Array(analyserNode.frequencyBinCount);

        if (!sourceNodeRef) {
          sourceNodeRef = audioCtx.createMediaElementSource(audioElement);
          sourceNodeRef.connect(analyserNode);
          analyserNode.connect(audioCtx.destination);
        }
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    window.addEventListener("touchstart", () => {
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    }, { passive: true });

    function stopSampleOscillator() {
      if (synthOsc) {
        try { synthOsc.stop(); synthOsc.disconnect(); } catch (err) {}
        synthOsc = null;
      }
    }

    function playTrackById(trackId) {
      const idx = tracks.findIndex((t) => t.id === trackId);
      if (idx === -1) return;
      playTrackAtIndex(idx);
    }

    function playTrackAtIndex(index) {
      if (!tracks.length) return;
      ensureAudioEngineReady();
      currentTrackIndex = Math.max(0, Math.min(tracks.length - 1, index));
      const track = tracks[currentTrackIndex];

      // Immediately Morph Full Background & UI Theme to Selected Song's Color
      applySongTheme(track.palette);

      document.getElementById("miniTitle").textContent = track.title;
      document.getElementById("miniArtist").textContent = track.artist;
      document.getElementById("npTitle").textContent = track.title;
      document.getElementById("npArtist").textContent = track.artist;

      stopSampleOscillator();

      if (track.sample) {
        audioElement.pause();
        synthOsc = audioCtx.createOscillator();
        synthGain = audioCtx.createGain();
        synthOsc.type = "sine";
        synthOsc.frequency.setValueAtTime(track.freq, audioCtx.currentTime);
        synthGain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        synthOsc.connect(synthGain);
        synthGain.connect(analyserNode);
        synthOsc.start();
        document.getElementById("durationTimeEl").textContent = "SYNTH DEMO";
        isPlaying = true;
      } else {
        audioElement.src = track.url;
        audioElement.play().catch(() => {});
        isPlaying = true;
      }

      syncPlayPauseIcons();
      renderCurrentView();
    }

    function togglePlayPause() {
      if (!tracks.length) return;
      ensureAudioEngineReady();
      const track = tracks[currentTrackIndex];
      if (isPlaying) {
        if (track.sample) stopSampleOscillator();
        else audioElement.pause();
        isPlaying = false;
      } else {
        if (!track.sample && audioElement.src) {
          audioElement.play().catch(() => {});
          isPlaying = true;
        } else {
          playTrackAtIndex(currentTrackIndex);
        }
      }
      syncPlayPauseIcons();
    }

    function playNextTrack() {
      if (!tracks.length) return;
      playTrackAtIndex((currentTrackIndex + 1) % tracks.length);
    }

    function playPrevTrack() {
      if (!tracks.length) return;
      playTrackAtIndex((currentTrackIndex - 1 + tracks.length) % tracks.length);
    }

    function syncPlayPauseIcons() {
      const svgPath = isPlaying
        ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
        : '<path d="M8 5v14l11-7z"/>';
      document.getElementById("miniPlayIcon").innerHTML = svgPath;
      document.getElementById("npPlayIcon").innerHTML = svgPath;
    }

    function formatSeconds(sec) {
      if (!isFinite(sec) || sec < 0) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? "0" : ""}${s}`;
    }

    audioElement.addEventListener("timeupdate", () => {
      if (audioElement.duration) {
        const pct = (audioElement.currentTime / audioElement.duration) * 100;
        document.getElementById("seekBar").value = pct;
        document.getElementById("currentTimeEl").textContent = formatSeconds(audioElement.currentTime);
        document.getElementById("durationTimeEl").textContent = formatSeconds(audioElement.duration);
      }
    });
    audioElement.addEventListener("ended", playNextTrack);

    document.getElementById("seekBar").addEventListener("input", (e) => {
      if (audioElement.duration) {
        audioElement.currentTime = (e.target.value / 100) * audioElement.duration;
      }
    });

    document.getElementById("miniPlayBtn").addEventListener("click", (e) => { e.stopPropagation(); togglePlayPause(); });
    document.getElementById("miniNextBtn").addEventListener("click", (e) => { e.stopPropagation(); playNextTrack(); });
    document.getElementById("playBtn").addEventListener("click", togglePlayPause);
    document.getElementById("nextBtn").addEventListener("click", playNextTrack);
    document.getElementById("prevBtn").addEventListener("click", playPrevTrack);

    /********************************************************************
     * 3-Dots (⋮) Menu Logic: Add to Queue, Make a New Playlist, Delete

    const trackActionModal = document.getElementById("trackActionModal");
    const trackActionModalContent = document.getElementById("trackActionModalContent");

      trackActionModal.className = "fixed inset-0 z-50 bg-black/65 backdrop-blur-md flex items-end sm:items-center justify-center p-4";

    function closeTrackMenu() {
      trackActionModalContent.classList.remove("translate-y-0", "opacity-100");
      trackActionModalContent.classList.add("translate-y-4", "opacity-0");
      setTimeout(() => {
        trackActionModal.className = "fixed inset-0 z-50 bg-black/65 backdrop-blur-md hidden items-end sm:items-center justify-center p-4";

    trackActionModal.addEventListener("click", (e) => {

    // 1. Add to Queue
    document.getElementById("menuAddToQueueBtn").addEventListener("click", () => {
      const track = tracks.find((t) => t.id === selectedMenuTrackId);
      if (track) {
        queueList.push({ ...track });
        showToast(`Added "${track.title}" to Queue`);
        if (activeTab === 2) renderCurrentView();
      }
      closeTrackMenu();
    });

    // 2. Make a New Playlist (Inline Creator)
    document.getElementById("menuNewPlaylistBtn").addEventListener("click", () => {
      const box = document.getElementById("inlinePlaylistBox");
      box.classList.toggle("hidden");
      if (!box.classList.contains("hidden")) {
        document.getElementById("inlinePlaylistInput").focus();
      }

    document.getElementById("saveInlinePlaylistBtn").addEventListener("click", () => {
      const input = document.getElementById("inlinePlaylistInput");
      const name = input.value.trim();
      const track = tracks.find((t) => t.id === selectedMenuTrackId);
      if (!name) return;

      playlists.push({
        id: "pl_" + Date.now(),
        name,
        tracks: track ? [track] : [],
        palette: track ? track.palette : COLOR_PALETTES[0]
      });

      showToast(`Created playlist "${name}"`);
      closeTrackMenu();
      setActiveTab(1); // Switch smoothly to Playlists tab to show the new playlist
    });

    // 3. Delete Track
    document.getElementById("menuDeleteTrackBtn").addEventListener("click", () => {
      if (!selectedMenuTrackId) return;
      const cardEl = document.getElementById("card_" + selectedMenuTrackId);
      if (cardEl) {
        cardEl.style.transform = "scale3d(0.92, 0.92, 1)";
        cardEl.style.opacity = "0";
      }

      const deletedTrack = tracks.find((t) => t.id === selectedMenuTrackId);
      setTimeout(() => {
        tracks = tracks.filter((t) => t.id !== selectedMenuTrackId);
        queueList = queueList.filter((t) => t.id !== selectedMenuTrackId);

        if (dbInstance) {
          const tx = dbInstance.transaction(STORE_NAME, "readwrite");
          tx.objectStore(STORE_NAME).delete(selectedMenuTrackId);
        }

        if (currentTrackIndex >= tracks.length) {
          currentTrackIndex = Math.max(0, tracks.length - 1);
        }
        if (tracks[currentTrackIndex]) {
          applySongTheme(tracks[currentTrackIndex].palette);
        }
        renderCurrentView();
        if (deletedTrack) showToast(`Deleted "${deletedTrack.title}"`);
      }, 220);

      closeTrackMenu();
    });

/********************************************************************
     * Segmented Pill Spring Physics & Touch Dragging
     ********************************************************************/
    const segmentedBar = document.getElementById("segmentedBar");
    const pillOuter = document.getElementById("segmentPillOuter");
    const pillInner = document.getElementById("segmentPillInner");
    const segButtons = document.querySelectorAll(".seg-btn");
    let popTimeout = null;

    function triggerPillPop() {
      pillInner.classList.add("pop");
      clearTimeout(popTimeout);
      popTimeout = setTimeout(() => pillInner.classList.remove("pop"), 240);
    }

    function setActiveTab(idx) {
      activeTab = Math.max(0, Math.min(2, idx));
      pillOuter.classList.remove("dragging");
      pillOuter.style.transform = `translate3d(${activeTab * 100}%, 0, 0)`;
      triggerPillPop();

      segButtons.forEach((btn, i) => {
        btn.className = `seg-btn relative z-10 flex-1 py-2.5 text-xs font-semibold text-center transition-colors ${
          i === activeTab ? "text-white" : "text-white/60"
        }`;
      });
      renderCurrentView();
    }

    let isSegDragging = false;
    segmentedBar.addEventListener("pointerdown", (e) => {
      isSegDragging = true;
      pillOuter.classList.add("dragging");
      pillInner.classList.add("pop");
      segmentedBar.setPointerCapture(e.pointerId);
    });

    segmentedBar.addEventListener("pointermove", (e) => {
      if (!isSegDragging) return;
      const rect = segmentedBar.getBoundingClientRect();
      const relX = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
      const ratio = (relX / rect.width) * 3 - 0.5;
      const clamped = Math.max(0, Math.min(2, ratio));
      pillOuter.style.transform = `translate3d(${clamped * 100}%, 0, 0)`;
    });

    function finishSegDrag(e) {
      if (!isSegDragging) return;
      isSegDragging = false;
      const rect = segmentedBar.getBoundingClientRect();
      const relX = Math.max(0, Math.min(rect.width - 1, e.clientX - rect.left));
      const targetIdx = Math.floor((relX / rect.width) * 3);
      setActiveTab(targetIdx);
    }
    segmentedBar.addEventListener("pointerup", finishSegDrag);
    segmentedBar.addEventListener("pointercancel", finishSegDrag);

    /********************************************************************
     * Now Playing Bottom Sheet Gestures
     ********************************************************************/
    const nowPlayingSheet = document.getElementById("nowPlayingSheet");
    const miniPlayer = document.getElementById("miniPlayer");
    let sheetStartY = 0;
    let sheetCurrentY = 0;
    let sheetLastTime = 0;
    let sheetVelocity = 0;
    let isSheetDragging = false;

    function setNowPlayingOpen(open) {
      nowPlayingSheet.classList.remove("dragging");
      nowPlayingSheet.style.transform = open ? "translate3d(0, 0, 0)" : "translate3d(0, 100%, 0)";
    }

    miniPlayer.addEventListener("click", () => setNowPlayingOpen(true));
    document.getElementById("closeSheetBtn").addEventListener("click", () => setNowPlayingOpen(false));

    nowPlayingSheet.addEventListener("touchstart", (e) => {
      if (e.target.id === "seekBar") return;
      isSheetDragging = true;
      sheetStartY = e.touches[0].clientY;
      sheetCurrentY = sheetStartY;
      sheetLastTime = performance.now();
      sheetVelocity = 0;
      nowPlayingSheet.classList.add("dragging");
    }, { passive: true });

    nowPlayingSheet.addEventListener("touchmove", (e) => {
      if (!isSheetDragging) return;
      const y = e.touches[0].clientY;
      const now = performance.now();
      const dt = Math.max(1, now - sheetLastTime);
      sheetVelocity = (y - sheetCurrentY) / dt;
      sheetCurrentY = y;
      sheetLastTime = now;

      const deltaY = Math.max(0, sheetCurrentY - sheetStartY);
      nowPlayingSheet.style.transform = `translate3d(0, ${deltaY}px, 0)`;
    }, { passive: true });

    nowPlayingSheet.addEventListener("touchend", () => {
      if (!isSheetDragging) return;
      isSheetDragging = false;
      const deltaY = sheetCurrentY - sheetStartY;
      if (deltaY > 120 || sheetVelocity > 0.65) {
        setNowPlayingOpen(false);
      } else {
        setNowPlayingOpen(true);
      }
    });

    /********************************************************************
     * 120Hz Visualizer & Smooth RGB Color Interpolation Loop
     ********************************************************************/
    const canvas = document.getElementById("visualizerCanvas");
    const ctx = canvas.getContext("2d");

    function setupRetinaCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = 288 * dpr;
      canvas.height = 48 * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    setupRetinaCanvas();
    window.addEventListener("resize", setupRetinaCanvas);

    let smoothBass = 0;
    const npMainArtEl = document.getElementById("npMainArt");
    const miniArtEl = document.getElementById("miniArt");
    const npArtGlowRingEl = document.getElementById("npArtGlowRing");
    const orb1El = document.getElementById("ambientOrb1");
    const orb2El = document.getElementById("ambientOrb2");

    function render120HzFrame() {
      if (analyserNode && isPlaying && freqDataArray) {
        analyserNode.getByteFrequencyData(freqDataArray);
      } else if (freqDataArray) {
        freqDataArray.fill(0);
      }

      // Smoothly interpolate RGB values for silky color transitions
      currentRGB[0] += (targetRGB[0] - currentRGB[0]) * 0.08;
      currentRGB[1] += (targetRGB[1] - currentRGB[1]) * 0.08;
      currentRGB[2] += (targetRGB[2] - currentRGB[2]) * 0.08;

      const rawBass = freqDataArray
        ? (freqDataArray[0] + freqDataArray[1] + freqDataArray[2] + freqDataArray[3]) / (4 * 255)
        : 0;
      smoothBass += (rawBass - smoothBass) * 0.32;

      const artScale = 1 + Math.pow(smoothBass, 1.35) * 0.15;
      const orbScale = 1 + smoothBass * 0.24;
      const glowScale = 1 + smoothBass * 0.35;

      npMainArtEl.style.transform = `translate3d(0,0,0) scale3d(${artScale}, ${artScale}, 1)`;
      miniArtEl.style.transform = `translate3d(0,0,0) scale3d(${1 + smoothBass * 0.1}, ${1 + smoothBass * 0.1}, 1)`;
      npArtGlowRingEl.style.transform = `translate3d(0,0,0) scale3d(${glowScale}, ${glowScale}, 1)`;
      npArtGlowRingEl.style.opacity = (0.24 + smoothBass * 0.62).toFixed(2);

      orb1El.style.transform = `translate3d(0,0,0) scale3d(${orbScale}, ${orbScale}, 1)`;
      orb2El.style.transform = `translate3d(0,0,0) scale3d(${orbScale * 1.05}, ${orbScale * 1.05}, 1)`;

      ctx.clearRect(0, 0, 288, 48);
      const bars = 24;
      const barWidth = 7.5;
      const gap = 4.5;
      const r = Math.round(currentRGB[0]);
      const g = Math.round(currentRGB[1]);
      const b = Math.round(currentRGB[2]);

      for (let i = 0; i < bars; i++) {
        const val = freqDataArray ? freqDataArray[i] / 255 : 0;
        const barHeight = Math.max(4, val * 48);
        const x = i * (barWidth + gap);
        const y = (48 - barHeight) / 2;
        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${0.38 + val * 0.62})`;
        ctx.beginPath();
        ctx.roundRect(x, y, barWidth, barHeight, 4);
        ctx.fill();
      }

      requestAnimationFrame(render120HzFrame);
    }
    requestAnimationFrame(render120HzFrame);

    /********************************************************************
     * Render Library Views (Tracks, Playlists, Queue)
     ********************************************************************/

                  <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
                  </svg>
                </div>
                <div class="truncate">
                  <div class="flex items-center gap-2">
                    <p class="text-sm font-semibold text-white truncate">${t.title}</p>
                    ${t.sample ? '<span class="px-2.5 py-0.5 text-[10px] rounded-full bg-teal-950/80 border border-teal-400/30 text-teal-300 font-medium">Sample</span>' : ''}
                  </div>
                  <p class="text-xs text-white/60 truncate mt-0.5">${t.artist}</p>
                </div>
              </div>
              <button type="button"
                      onclick="openTrackMenu(event, '${t.id}')"
                      class="tactile-btn w-9 h-9 rounded-full hover:bg-white/10 flex items-center justify-center text-white/55 hover:text-white shrink-0">
                ⋮
              </button>
            </div>
          `;
        }).join("");
      } else {
        container.innerHTML = `
          <div class="flex items-center justify-between mb-3 px-1">
            <h2 class="text-sm font-semibold text-white/90">Your Playlists</h2>
            <button onclick="promptNewPlaylist()" class="tactile-btn px-3.5 py-1.5 rounded-full smooth-card text-xs font-semibold text-white">+ New Playlist</button>
          </div>
          ${playlists.length === 0 ? `
            <div class="smooth-card rounded-3xl p-8 text-center flex flex-col items-center justify-center my-3">
              <div class="w-14 h-14 rounded-2xl flex items-center justify-center mb-4"
                   style="background: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.16); border: 1px solid rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.35);">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h10"/>
                </svg>
              </div>
              <h3 class="text-base font-bold mb-1">No Playlists Yet</h3>
              <p class="text-xs text-white/60 max-w-xs mb-5 leading-relaxed">
                Tap the 3-dots (⋮) on any song or tap below to create your first custom playlist.
              </p>
              <button onclick="promptNewPlaylist()" class="tactile-btn px-5 py-2.5 rounded-full smooth-card text-xs font-semibold text-white">
                Create First Playlist
              </button>
            </div>
          ` : playlists.map((pl) => `
            <div class="track-enter smooth-card rounded-3xl p-4 flex items-center justify-between">
              <div class="flex items-center gap-3.5">
                <div class="w-11 h-11 rounded-2xl flex items-center justify-center text-white font-bold text-sm"
                     style="background: linear-gradient(135deg, ${pl.palette.primary}, ${pl.palette.secondary});">
                  ♪
                </div>
                <div>
                  <p class="font-semibold text-sm text-white">${pl.name}</p>
                  <p class="text-xs text-white/55">${pl.tracks.length} song${pl.tracks.length === 1 ? '' : 's'}</p>
                </div>
              </div>
            </div>
          `).join("")}
        `;
      }
    }

    function promptNewPlaylist() {
      const name = prompt("Enter new playlist name:");
      if (name && name.trim()) {
        playlists.push({
          id: "pl_" + Date.now(),
          name: name.trim(),
          tracks: tracks[currentTrackIndex] ? [tracks[currentTrackIndex]] : [],
          palette: tracks[currentTrackIndex]?.palette || COLOR_PALETTES[0]
        });
        renderCurrentView();
        showToast(`Created playlist "${name.trim()}"`);
      }
    }

    // Initialize with first song's theme
    applySongTheme(tracks[0].palette);
    renderCurrentView();
  </script>
</body>
</html>
